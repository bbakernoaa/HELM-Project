# ─────────────────────────────────────────────────────────────────────────────
# TICK CI Pipeline (GitHub Actions)
#
# Builds and tests the TICK micro-library INSIDE the HELM project Docker
# container (built from the root DockerFile via docker compose), so the
# toolchain matches local development exactly (GCC-13, CMake, GTest,
# RapidCheck).
#
# Stages:
#   1. Tier 1 isolation scan — reject any forbidden cross-HELM includes
#   2. Standalone CMake build (produces HELM::TICK + test executables)
#   3. Unit + property tests via ctest
#
# This workflow is designed to run from the HELM mono-repo root, triggered
# when the libs/tick/ subtree is modified.
# ─────────────────────────────────────────────────────────────────────────────
name: TICK CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch: {}

jobs:
  tick:
    name: TICK build, test, isolation scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # Build the HELM dev container from the root DockerFile.
      # The container provides GCC-13, CMake, Ninja, GTest, and RapidCheck.
      - name: Build HELM dev container
        run: docker build -t helm-dev -f DockerFile .

      # Stage 1 — Tier 1 isolation scan (Requirements 13.6, 14.5).
      # Verify TICK includes ONLY C++20 standard library headers and its own
      # tick/ headers — no cross-HELM references (halo, logs, axis, amio, span, dagr).
      - name: "Stage 1: Tier 1 isolation scan"
        run: |
          docker run --rm -v ${{ github.workspace }}:/workspace/helm-project -w /workspace/helm-project helm-dev bash -lc '
            echo "Scanning libs/tick/ for forbidden cross-HELM includes..."
            if grep -rn --include="*.hpp" --include="*.cpp" --include="*.h" \
              -E "#include\s*[<\"](halo|logs|axis|amio|span|dagr)/" \
              libs/tick/include/ libs/tick/src/; then
              echo "ERROR: Tier 1 isolation violation — forbidden cross-HELM includes detected"
              exit 1
            fi
            echo "Tier 1 isolation scan: PASS"
          '

      # Stage 2 — Standalone CMake build inside Docker (Requirements 13.3, 13.6).
      # Configure + build libs/tick producing the HELM::TICK static library
      # and all test executables with BUILD_TESTING=ON.
      - name: "Stage 2: Standalone build (produces HELM::TICK)"
        run: |
          docker run --rm -v ${{ github.workspace }}:/workspace/helm-project -w /workspace/helm-project/libs/tick helm-dev bash -lc '
            set -e
            cmake -B build -G Ninja \
              -DBUILD_TESTING=ON
            cmake --build build --parallel $(nproc)
          '

      # Stage 3 — Run all tests: unit tests + property tests via ctest.
      - name: "Stage 3: Tests (unit + property)"
        run: |
          docker run --rm -v ${{ github.workspace }}:/workspace/helm-project -w /workspace/helm-project/libs/tick/build helm-dev bash -lc '
            ctest --output-on-failure
          '
