# ─────────────────────────────────────────────────────────────────────────────
# AXIS Benchmark CI Pipeline (GitHub Actions)
#
# Performance regression detection for the AXIS interpolation library.
# Runs on every merge to main and compares against stored baselines.
#
# Benchmark cases (Requirement 13.1, 6.1):
#   1. Bilinear O48→O96
#   2. Conservative O48→O96
#   3. Batch apply 10 vars O96→O96
#   4. CSR apply O96→O96
#   5. Conservative 1440×720→720×360
#   6. Conservative 3600×1800→1440×720
#
# Regression threshold: 15% above baseline (Requirement 6.3)
# Execution: Kokkos::HostSpace for reproducibility (Requirement 13.5)
# Output: JSON with case name, wall_clock_ms, date, commit (Requirement 13.3)
# Manual dispatch: update baseline (Requirement 13.4)
# ─────────────────────────────────────────────────────────────────────────────
name: AXIS Benchmark

on:
  push:
    branches: [develop]
    paths:
      - "libs/axis/**"
      - ".github/workflows/axis-benchmark.yml"
      - ".github/benchmarks/baseline.json"
  workflow_dispatch:
    inputs:
      update_baseline:
        description: "Update baseline with current run results"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

jobs:
  benchmark:
    name: AXIS performance benchmarks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Bring up HELM container
        run: docker compose up -d --build

      # Build AXIS in Release mode for accurate timing (Requirement 13.5).
      - name: "Build AXIS (Release, HostSpace)"
        run: |
          docker compose exec -T helm-dev bash -lc '
            set -e
            cd libs/axis
            rm -rf build-bench
            cmake -B build-bench -G Ninja \
              -DCMAKE_CXX_STANDARD=20 \
              -DCMAKE_BUILD_TYPE=Release \
              -DBUILD_TESTING=OFF \
              -DBUILD_BENCHMARKS=ON
            cmake --build build-bench --parallel $(nproc)
          '

      # Run the benchmark harness and capture JSON output (Requirement 13.1).
      - name: "Run benchmarks"
        run: |
          docker compose exec -T helm-dev bash -lc '
            set -e
            cd libs/axis/build-bench
            OMP_PROC_BIND=false ./benchmarks/axis_benchmarks \
              --commit ${{ github.sha }} \
              --output /workspace/helm-project/benchmark_results.json
          '

      # Compare against baseline; fail if regression >15% (Requirements 6.2, 6.3, 13.6).
      - name: "Check for regressions"
        if: ${{ github.event.inputs.update_baseline != 'true' }}
        run: |
          docker compose exec -T helm-dev bash -lc '
            set -e
            python3 - <<'PYEOF'
          import json
          import sys

          REGRESSION_THRESHOLD = 0.15  # 15%

          # Load baseline
          try:
              with open("/workspace/helm-project/.github/benchmarks/baseline.json") as f:
                  baseline = json.load(f)
          except FileNotFoundError:
              print("WARNING: No baseline found — skipping regression check")
              sys.exit(0)

          # Load current results
          with open("/workspace/helm-project/benchmark_results.json") as f:
              results = json.load(f)

          # Build baseline lookup by case name
          baseline_map = {b["name"]: b["wall_clock_ms"] for b in baseline}

          regressions = []
          print(f"{'Case':<40} {'Baseline (ms)':<15} {'Current (ms)':<15} {'Delta':<10} {'Status'}")
          print("-" * 95)

          for result in results:
              name = result["name"]
              current_ms = result["wall_clock_ms"]

              if name not in baseline_map:
                  print(f"{name:<40} {'N/A':<15} {current_ms:<15.2f} {'NEW':<10} SKIP")
                  continue

              baseline_ms = baseline_map[name]
              if baseline_ms <= 0:
                  print(f"{name:<40} {baseline_ms:<15.2f} {current_ms:<15.2f} {'N/A':<10} SKIP (zero baseline)")
                  continue

              delta = (current_ms - baseline_ms) / baseline_ms
              status = "PASS" if delta <= REGRESSION_THRESHOLD else "FAIL"

              if delta > REGRESSION_THRESHOLD:
                  regressions.append({
                      "name": name,
                      "baseline_ms": baseline_ms,
                      "current_ms": current_ms,
                      "regression_pct": delta * 100
                  })

              print(f"{name:<40} {baseline_ms:<15.2f} {current_ms:<15.2f} {delta*100:>+7.1f}%   {status}")

          print()

          if regressions:
              print(f"REGRESSION DETECTED: {len(regressions)} benchmark(s) exceeded {REGRESSION_THRESHOLD*100:.0f}% threshold")
              for r in regressions:
                  print(f"  - {r['name']}: {r['current_ms']:.2f}ms vs baseline {r['baseline_ms']:.2f}ms (+{r['regression_pct']:.1f}%)")
              sys.exit(1)
          else:
              print("All benchmarks within regression threshold.")
          PYEOF
          '

      # Update baseline when manually triggered (Requirement 13.4).
      - name: "Update baseline"
        if: ${{ github.event.inputs.update_baseline == 'true' }}
        run: |
          cp benchmark_results.json .github/benchmarks/baseline.json
          # Note: In practice this would commit and push, but that requires
          # write permissions configured on the workflow token.
          echo "Baseline updated with current results."

      # Upload results as artifact for historical tracking.
      - name: "Upload benchmark results"
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: axis-benchmark-results
          path: benchmark_results.json
          retention-days: 90

      - name: Tear down container
        if: always()
        run: docker compose down || true
